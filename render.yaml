services:
  # Backend Web Service
  - type: web
    name: pmss-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://prime-minister-special-scholarship-portal.onrender.com
      - key: FRONTEND_URL
        value: https://prime-minister-special-scholarship-portal.onrender.com
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # Frontend Static Site
  - type: static
    name: pmss-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pmsss-t2og.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://pmsss-t2og.onrender.com

